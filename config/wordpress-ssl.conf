# =============================================================================
# /etc/apache2/sites-available/wordpress-ssl.conf
# VirtualHost HTTPS (porta 443) com certificado autoassinado (desafio extra).
# Criado automaticamente pelo script 07-https-opcional.sh.
# =============================================================================
<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName www.grupo1.redes2.internal
    ServerAlias 192.168.56.10

    DocumentRoot /var/www/wordpress

    <Directory /var/www/wordpress>
        AllowOverride All
        Require all granted
    </Directory>

    SSLEngine on
    SSLCertificateFile    /etc/apache2/ssl/wordpress.crt
    SSLCertificateKeyFile /etc/apache2/ssl/wordpress.key

    ErrorLog ${APACHE_LOG_DIR}/wordpress_ssl_error.log
    CustomLog ${APACHE_LOG_DIR}/wordpress_ssl_access.log combined
</VirtualHost>
</IfModule>
